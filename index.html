<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio El Mevarej - En Vivo</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 350px;
      width: 100%;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }
    p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 25px;
    }
    audio {
      width: 100%;
      outline: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>📻 Radio El Mevarej</h1>
    <p>Transmisión en Vivo</p>
    
    <!-- Reemplaza el texto entre comillas por la URL exacta de tu streaming -->
    <audio controls preload="none">
      <source src="https://radioelmevarej.ismyradio.com;listen" type="audio/mpeg">
      Tu navegador no soporta el reproductor de audio.
    </audio>
  </div>

</body>
</html>
